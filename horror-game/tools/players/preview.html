<!doctype html><html><head><meta charset="utf-8"><title>players preview</title>
<base href="/">
<style>html,body{margin:0;background:#000;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
// 預覽四個玩家模型（tools/players/preview.mjs 用無頭瀏覽器開這一頁並截圖）。
// ?states=JSON 陣列（每個玩家的 update 參數）&t=模擬秒數&cam=front|side|back|hand|top&light=1
import * as THREE from 'three';
import { loadPlayerAssets, makePlayerModel } from '/src/player-model.js';

const qs = new URLSearchParams(location.search);
const states = JSON.parse(qs.get('states') || '[{"speed":0},{"speed":1.4},{"speed":3.5,"running":true},{"speed":0.8,"crouch":true}]');
const simT = Number(qs.get('t') || 2);
const cam = qs.get('cam') || 'front';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x202428);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ color: 0x5a5d60, roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);
// 地上每 0.5 公尺一條線，用來看腳有沒有滑、有沒有陷進地板
const grid = new THREE.GridHelper(30, 60, 0x333333, 0x404040);
grid.position.y = 0.002;
scene.add(grid);
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x302820, qs.get('light') ? 0.25 : 1.4));
const sun = new THREE.DirectionalLight(0xffffff, qs.get('light') ? 0.3 : 2.2);
sun.position.set(3, 6, 5);
sun.castShadow = true;
sun.shadow.camera.left = -6; sun.shadow.camera.right = 6; sun.shadow.camera.top = 6; sun.shadow.camera.bottom = -6;
scene.add(sun);
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 100);
const quality = { propTex: 1024, aniso: 4 };
const assets = await loadPlayerAssets(renderer, quality, 60000);
const info = { ok: !!assets, models: [] };
if (assets) {
  const models = states.map((st, i) => {
    const m = makePlayerModel(assets, i);
    // 玩家一字排開、間隔 1.2 公尺，面向鏡頭（player.js 的 yaw = 0 是看向 -Z，所以要轉 180 度才會面向 +Z 的鏡頭）
    m.setTransform((i - (states.length - 1) / 2) * 1.2, 0, 0, Math.PI + (st.yaw || 0));
    scene.add(m.root);
    if (qs.get('light')) {
      m.setFlashlight(true);
      const spot = new THREE.SpotLight(0xfff1d0, 25, 12, 0.35, 0.5, 1.5);
      spot.castShadow = false;
      m.lightSocket.add(spot);
      spot.target.position.set(0, 0, 1);
      m.lightSocket.add(spot.target);
    }
    return m;
  });
  // 固定時間步長模擬到指定時間
  const steps = Math.round(simT * 60);
  for (let k = 0; k < steps; k++) models.forEach((m, i) => m.update(1 / 60, states[i]));
  scene.updateMatrixWorld(true);
  for (const m of models) {
    const box = new THREE.Box3().setFromObject(m.root, true);
    const s = new THREE.Vector3();
    m.lightSocket.getWorldPosition(s);
    const dir = new THREE.Vector3(0, 0, 1).transformDirection(m.lightSocket.matrixWorld);
    info.models.push({ slot: m.slot, avatar: m.avatar, box: [box.min.toArray().map((v) => +v.toFixed(2)), box.max.toArray().map((v) => +v.toFixed(2))], socket: s.toArray().map((v) => +v.toFixed(2)), beam: dir.toArray().map((v) => +v.toFixed(2)) });
  }
  window.__models = models;
}
const n = states.length;
if (cam === 'front') { camera.position.set(0, 1.3, 2.2 + n * 1.35); camera.lookAt(0, 0.85, 0); }
else if (cam === 'back') { camera.position.set(0, 1.3, -(2.2 + n * 1.35)); camera.lookAt(0, 0.85, 0); }
else if (cam === 'side') { camera.position.set(n * 1.2 + 3.5, 1.2, 3.5); camera.lookAt(0, 0.7, 0.3); }
else if (cam === 'top') { camera.position.set(0, 7, 4); camera.lookAt(0, 0, 0.5); }
else if (cam === 'hand') { const x = (-(n - 1) / 2) * 1.2; camera.position.set(x - 0.9, 1.3, 1.1); camera.lookAt(x - 0.2, 1.0, 0.2); camera.fov = 30; camera.updateProjectionMatrix(); }
renderer.render(scene, camera);
window.__info = info;
document.title = 'ready';
</script></body></html>
